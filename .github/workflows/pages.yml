name: Deploy Chess Notebook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test app and bundled Stockfish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check app syntax
        run: node --check dist/app.js
      - name: Check rules, hints, clocks, PGN and review
        run: node qa.cjs
      - name: Test bundled offline Stockfish
        run: node engine-test.cjs

  deploy:
    name: Deploy GitHub Pages
    needs: validate
    concurrency:
      group: github-pages-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Refresh offline asset cache
        run: python3 refresh-cache.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
